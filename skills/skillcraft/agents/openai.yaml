interface:
  display_name: "Skillcraft"
  short_description: "Create and revise shared or project-private skills"
  icon_small: "./assets/skillcraft-small.svg"
  icon_large: "./assets/skillcraft.png"
  default_prompt: "Use $skillcraft to create or revise this Codex skill. Classify its ownership first: keep project-private skill revisions local to the owning project, and publish shared or lock-managed revisions with the exact named Skills CLI update unless I explicitly request local-only changes."
